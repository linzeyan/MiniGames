name: SmallGame
options:
  bundleIdPrefix: com.zeyanlin
  deploymentTarget:
    iOS: "17.0"
  # The app is authored in Traditional Chinese; English is a translation.
  developmentLanguage: zh-Hant
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # New-app default in Xcode 26; keeps SwiftUI/SpriteKit code free of
    # explicit @MainActor annotations.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    # Sandboxed run scripts cannot read sources, which breaks the SwiftLint phase.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  SmallGame:
    type: application
    platform: iOS
    sources:
      - SmallGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeyanlin.smallgame
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Simulator: ad-hoc signing, no Apple account needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
        # Device / TestFlight / App Store: standard automatic signing.
        CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        DEVELOPMENT_TEAM[sdk=iphoneos*]: NKJSLB6HBR
    # iCloud key-value store: mirrors best scores across the player's devices.
    # Device builds need the matching capability on the App ID; automatic
    # signing adds it on the first device build.
    entitlements:
      path: SmallGame/SmallGame.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: SmallGame/Info.plist
      properties:
        CFBundleDisplayName: MiniGames
        # Without these the generated Info.plist keeps XcodeGen's 1.0/1
        # placeholders, and Settings would report a version nobody shipped.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declared explicitly so iOS offers the per-app language picker in
        # Settings; deriving it from the .lproj folders alone is unreliable.
        CFBundleLocalizations:
          - zh-Hant
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    preBuildScripts:
      - name: SwiftLint
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            cd "${SRCROOT}" && swiftlint
          elif [ -x /opt/homebrew/bin/swiftlint ]; then
            cd "${SRCROOT}" && /opt/homebrew/bin/swiftlint
          else
            echo "warning: SwiftLint not installed; skipping lint"
          fi
        basedOnDependencyAnalysis: false

  SmallGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SmallGame

schemes:
  SmallGame:
    build:
      targets:
        SmallGame: all
        SmallGameTests: [test]
    test:
      targets:
        - SmallGameTests
    run:
      config: Debug
